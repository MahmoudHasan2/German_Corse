; Portable German Coach. extension_dir and certificate paths are passed by "Start German Coach.bat".
[PHP]
memory_limit = 256M
max_execution_time = 120
display_errors = Off
log_errors = On
post_max_size = 12M
upload_max_filesize = 8M
default_charset = "UTF-8"
allow_url_fopen = On
extension=curl
extension=fileinfo
extension=intl
extension=mbstring
extension=openssl
extension=pdo_mysql
extension=sodium
